    <style>
        .product{
            width: 220px;
            height: 300px;

            border-radius: 12px;
            margin: 10px;
            box-shadow: 5px 0 black ;

            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            border:20px;
            margin-bottom: 15px;

        }

            color: blue;
            text-decoration: underline;
            border: 8px solid brown;
            margin-bottom: 9px;
        }
        div p{
            font-size: 20px;
            color: blueviolet;
            margin-bottom: 2px;
        }
        .discount{
            color:blue;
        }
        div button{
            color:pink;
            background-color: black;
            padding: 10px;
            border-radius: 20px;
        }
        .ecom{
            background-color: aqua;
            display: flex;
            justify-content: center;
            gap:50px;
            align-items: center;
            flex-wrap: wrap;
        }
    </style>

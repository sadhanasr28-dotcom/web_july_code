<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: red;
            height: 100px;
            width: 100px;
        }
        div:hover{
            background-color: blue;
            color: beige;
            transform: translatey(200px);
            transform: scale(1.2);
            transform: rotatey(360deg);
            transition: 2s;
        }
    </style>
</head>
<body>
    <div>
        Hello
    </div>
</body>
</html>
